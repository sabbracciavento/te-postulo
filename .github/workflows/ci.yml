name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos y build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://tepostulo.com.ar
      NEXT_PUBLIC_WHATSAPP_NUMBER: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Chequeo de tipos
        run: npx tsc --noEmit

      - name: Build de producción
        run: npm run build
